## No trigger
# trigger: none

## trigger on specific branch
trigger:
    - ssh

pool:
  name: 'Default'
  demands:
    - agent.os -equals linux
    - agent.name -equals quadz-customer-prod-vm

variables:
  - group: TerraformSecrets

steps:

# Step 0: Change working directory to /home/quadz/node-hello and git pull
- script: |
    cd /home/quadz/node-hello
    git pull origin ssh
  displayName: 'git pull'

# Step 1: Change working directory and Terraform Init
- script: |
    cd /home/quadz/node-hello
    terraform init -backend-config='backend-config.tfvars'
  displayName: 'Terraform Init'

# Step 2: Check if resources already exist and need updates
- script: |
    cd /home/quadz/node-hello
    terraform plan -var-file=default.tfvars -out=tfplan
    if grep -q "No changes. Infrastructure is up-to-date." tfplan; then
      echo "Resources are up-to-date. Skipping Apply."
      echo "##vso[task.setvariable variable=resourcesNeedUpdate]false"
    else
      echo "Resources need to be updated. Proceeding with Apply."
      echo "##vso[task.setvariable variable=resourcesNeedUpdate]true"
    fi
  displayName: 'Check Resource Changes'

# Step 3: Terraform Plan (only if resources need updates)
- script: |
    if [ "$(resourcesNeedUpdate)" == "true" ]; then
      cd /home/quadz/node-hello
      terraform plan -var-file=default.tfvars -out=tfplan
    else
      echo "Skipping Terraform Plan, resources are up-to-date."
    fi
  displayName: 'Terraform Plan'

# Step 4: Terraform Apply (only if resources need updates)
- script: |
    if [ "$(resourcesNeedUpdate)" == "true" ]; then
      cd /home/quadz/node-hello
      terraform apply -auto-approve tfplan
    else
      echo "Skipping Terraform Apply, resources are up-to-date."
    fi
  displayName: 'Terraform Apply'

# Step 5: Get VM IP Address
- script: |
    cd /home/quadz/node-hello
    terraform refresh -var-file=default.tfvars
    terraform output vm_ip
    export VM_IP=$(terraform output -raw vm_ip)

    echo "VM IP: $VM_IP"
    echo "##vso[task.setvariable variable=VM_IP]$VM_IP"
  displayName: 'Get VM Public IP'

# Step 6: Wait for VM to be ready
- script: |
    echo "Waiting for VM to be ready..."
    sleep 5
  displayName: 'Waiting for VM to be Ready'

# Step 7: SSH into VM and Deploy Node.js Application
- script: |
    echo "Attempting to SSH into the VM..."

    if [ -z "$VM_IP" ]; then
      echo "Error: VM_IP is not set."
      exit 1
    fi

    echo "VM IP is: $VM_IP"

    if ! [[ "$VM_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
      echo "Error: Invalid IP address format: $VM_IP"
      exit 1
    fi

    if [ -z "$VM_USERNAME" ] || [ -z "$VM_PASSWORD" ]; then
      echo "Error: VM_USERNAME or VM_PASSWORD is not set."
      exit 1
    fi

    # Save the private key
    # echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    chmod 600 ~/.ssh/id_rsa

    # Debugging the private key (optional, can be commented out for production)
    # echo "Debugging SSH Key:"
    # cat ~/.ssh/id_rsa
    # ls -l ~/.ssh/id_rsa

    # Sync application files to the VM
    rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" ./ "$VM_USERNAME@$VM_IP:/home/$VM_USERNAME/node-hello"

    # SSH into the VM and deploy the application
    ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$VM_USERNAME@$VM_IP" "
      echo 'Connected to the VM successfully!'
      cd /home/$VM_USERNAME/node-hello && \
      npm install && \
      sudo npm install -g pm2 && \
      if pm2 show 'app' > /dev/null; then
          echo 'App is already running. Restarting...'
          pm2 restart 'app'
      else
          echo 'App is not running. Starting the app...'
          pm2 start npm --name 'app' -- start
      fi && \
      pm2 save
      sudo chmod +x /tmp/https.sh
      bash /tmp/https.sh"
    "
  displayName: 'SSH into VM and Deploy Application'


